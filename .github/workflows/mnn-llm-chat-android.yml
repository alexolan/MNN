name: MNN LLM Chat Android

on:
  push:
    branches:
      - master
      - 'feature/**'
    paths:
      - 'apps/Android/MnnLlmChat/**'
      - 'apps/Android/frameworks/**'
      - '.github/workflows/mnn-llm-chat-android.yml'
  pull_request:
    branches: [master]
    paths:
      - 'apps/Android/MnnLlmChat/**'
      - 'apps/Android/frameworks/**'
      - '.github/workflows/mnn-llm-chat-android.yml'
  workflow_dispatch:

concurrency:
  group: mnn-llm-chat-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout incremental delivery
        uses: actions/checkout@v4
        with:
          path: incremental-delivery

      - name: Checkout MNN 3.6.1 source
        uses: actions/checkout@v4
        with:
          repository: alibaba/MNN
          ref: '3.6.1'
          path: source
          fetch-depth: 1

      - name: Verify MNN source tag
        working-directory: source
        run: |
          test "$(git describe --tags --exact-match)" = '3.6.1'
          test "$(git rev-parse HEAD)" = 'd407447ed56c4121a11ccbd266dc184ca1ead0c2'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate and apply incremental ZIP
        run: |
          test -f incremental-delivery/mnn-3.6.1-local-rag-incremental.zip
          python3 incremental-delivery/scripts/apply_incremental.py \
            --repo ./source \
            --zip ./incremental-delivery/mnn-3.6.1-local-rag-incremental.zip \
            --overlay-list ./incremental-overlay.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: source/apps/Android/MnnLlmChat/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        working-directory: source/apps/Android/MnnLlmChat
        run: chmod +x gradlew

      - name: Run standard debug unit tests
        working-directory: source/apps/Android/MnnLlmChat
        run: ./gradlew --no-daemon --stacktrace testStandardDebugUnitTest

      - name: Assemble standard debug APK
        working-directory: source/apps/Android/MnnLlmChat
        run: ./gradlew --no-daemon --stacktrace assembleStandardDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnn-llm-chat-test-reports
          path: |
            source/apps/Android/MnnLlmChat/app/build/reports/tests/
            source/apps/Android/MnnLlmChat/app/build/test-results/
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mnn-llm-chat-standard-debug-apk
          path: source/apps/Android/MnnLlmChat/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
